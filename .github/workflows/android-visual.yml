name: Android Staging 视觉回归

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'deployments/staging.json'
      - 'android/**'
      - 'visual/**'
      - 'e2e/**'
      - 'scripts/**'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-visual.yml'
      - '.github/actions/android-visual/**'
  push:
    branches: [master]
    paths:
      - 'deployments/staging.json'
      - 'android/**'
      - 'visual/**'
      - 'e2e/**'
      - 'scripts/**'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-visual.yml'
      - '.github/actions/android-visual/**'
  schedule:
    - cron: '42 22 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: '强制全量执行，不使用历史失败优先调度'
        type: boolean
        default: false
      group:
        description: '业务组；默认全部'
        type: choice
        options: [all, guest, account, social, rooms, wallet-help, records, texas, zhajinhua]
        default: all
      locale:
        description: '语言；默认三种语言'
        type: choice
        options: [all, zh-Hans, zh-Hant, en]
        default: all
      filter:
        description: '可选场景正则；默认执行全部场景'
        type: string
        default: ''
      mode:
        description: '比较基准或生成待审查基准'
        type: choice
        options: [compare, reference]
        default: compare

permissions:
  contents: read
  actions: read

concurrency:
  # 只淘汰同一 PR 的旧回归；手动、定时及 master 推送运行互不取消。
  group: android-visual-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      priority: ${{ steps.plan.outputs.priority }}
      remaining: ${{ steps.plan.outputs.remaining }}
      has-priority: ${{ steps.plan.outputs.has-priority }}
      has-remaining: ${{ steps.plan.outputs.has-remaining }}
      matrix: ${{ steps.plan.outputs.matrix }}
      merge-gate: ${{ steps.plan.outputs.merge-gate }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CI_ANDROID_GROUP: ${{ inputs.group || 'all' }}
          CI_ANDROID_LOCALE: ${{ inputs.locale || 'all' }}
          CI_ANDROID_FULL: ${{ inputs.full || false }}
          CI_ANDROID_FILTER: ${{ inputs.filter || '' }}
          CI_ANDROID_MODE: ${{ inputs.mode || 'compare' }}
        run: node scripts/android-ci-run.mjs plan
      - uses: actions/upload-artifact@v4
        with:
          name: android-ci-plan
          include-hidden-files: true
          overwrite: true
          path: .ttyctl/android-ci/plan.json
          retention-days: 14
          if-no-files-found: error
  apk:
    timeout-minutes: 30
    if: >-
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 下载并校验本轮唯一 Release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: node android/download-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: android-visual-apk
          path: android/artifacts/current/
          retention-days: 1
          if-no-files-found: error
  driver:
    if: >-
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 复用固定原生驱动
        id: driver-cache
        uses: actions/cache@v4
        with:
          path: .ttyctl/android-driver
          key: android-driver-${{ runner.os }}-${{ hashFiles('android/build-driver.mjs') }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        if: steps.driver-cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: '17'
      - name: 读取固定版本原生驱动源码
        if: steps.driver-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: microsoft/playwright
          ref: 39e3553a4f283a41134d75d7e404484bd9e6865a
          path: .ttyctl/playwright-driver-source
          persist-credentials: false
          sparse-checkout: packages/playwright-core/src/server/android/driver
      - name: 构建牌桌动画兼容驱动
        if: steps.driver-cache.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3; do
            if node android/build-driver.mjs; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((attempt * 20))
          done
      - name: 校验缓存或构建的原生驱动
        run: |
          test -s .ttyctl/android-driver/android-driver-target.apk
          test -s .ttyctl/android-driver/android-driver.apk
          node -e 'const source = require("./.ttyctl/android-driver/source.json"); if (source.revision !== "39e3553a4f283a41134d75d7e404484bd9e6865a" || source.patch !== 8) process.exit(1)'
      - name: 保存固定原生驱动
        uses: actions/upload-artifact@v4
        with:
          name: android-visual-driver
          path: .ttyctl/android-driver/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  priority:
    needs: [accounts, driver, apk]
    name: Android priority (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.accounts.outputs.priority) }}
    concurrency:
      group: android-staging-account-${{ matrix.account }}
      cancel-in-progress: false
      queue: max
    # 登录凭据仅供本仓库分支使用。
    if: >-
      needs.accounts.outputs.has-priority == 'true' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CI: 'true'
      ANDROID_SERIAL: emulator-5554
      ANDROID_GROUP: ${{ matrix.group }}
      ANDROID_LOCALE: ${{ matrix.locale }}
      CLRN_CI_ACCOUNT: ${{ matrix.account }}
      ANDROID_VISUAL_MODE: ${{ inputs.mode || 'compare' }}
      ANDROID_FILTER: ${{ inputs.filter || '' }}
      ANDROID_SHARD_FILTER: ${{ matrix.filter }}
      ANDROID_DIAGNOSTICS_DIR: android/artifacts/diagnostics
      ANDROID_DIAGNOSTICS_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android-visual
        with:
          accounts: ${{ secrets.CLRN_CI_TEST_ACCOUNTS_V2 }}
          testing-token: ${{ secrets.TESTING_API_TOKEN }}
  remaining:
    needs: [accounts, driver, apk, priority]
    name: Android remaining (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.accounts.outputs.remaining) }}
    concurrency:
      group: android-staging-account-${{ matrix.account }}
      cancel-in-progress: false
      queue: max
    # 登录凭据仅供本仓库分支使用。
    if: >-
      always() && !cancelled() &&
      needs.accounts.result == 'success' && needs.driver.result == 'success' && needs.apk.result == 'success' &&
      (needs.priority.result == 'success' ||
       (needs.accounts.outputs.has-priority == 'false' && needs.priority.result == 'skipped')) &&
      needs.accounts.outputs.has-remaining == 'true' &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft))
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CI: 'true'
      ANDROID_SERIAL: emulator-5554
      ANDROID_GROUP: ${{ matrix.group }}
      ANDROID_LOCALE: ${{ matrix.locale }}
      CLRN_CI_ACCOUNT: ${{ matrix.account }}
      ANDROID_VISUAL_MODE: ${{ inputs.mode || 'compare' }}
      ANDROID_FILTER: ${{ inputs.filter || '' }}
      ANDROID_SHARD_FILTER: ${{ matrix.filter }}
      ANDROID_DIAGNOSTICS_DIR: android/artifacts/diagnostics
      ANDROID_DIAGNOSTICS_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/android-visual
        with:
          accounts: ${{ secrets.CLRN_CI_TEST_ACCOUNTS_V2 }}
          testing-token: ${{ secrets.TESTING_API_TOKEN }}
  complete:
    name: ${{ needs.accounts.outputs.merge-gate != 'false' && 'Android full regression' || 'Android diagnostic regression' }}
    timeout-minutes: 15
    if: always()
    needs: [accounts, driver, apk, priority, remaining]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: android-ci-plan
          path: .ttyctl/android-ci
      - name: 验证当前提交完整覆盖并记录阶段结果
        env:
          GH_TOKEN: ${{ github.token }}
          CI_ANDROID_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/android-ci-run.mjs complete
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ci-results-${{ github.run_attempt }}
          include-hidden-files: true
          path: .ttyctl/android-ci/
          retention-days: 14
  # 保留已有 required-check 名称；跳过的重型阶段不能替代当前提交全量成功。
  visual:
    name: ${{ needs.accounts.outputs.merge-gate != 'false' && 'Android' || 'Android diagnostic' }} (${{ matrix.label }})
    if: always() && needs.accounts.result == 'success'
    needs: [accounts, complete]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.accounts.outputs.matrix) }}
    steps:
      - name: 保留分片合并门禁
        env:
          COMPLETE_RESULT: ${{ needs.complete.result }}
        run: test "$COMPLETE_RESULT" = success
