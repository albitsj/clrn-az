name: Repository checks

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: 保存本轮静态测量
        run: |
          mkdir -p "$RUNNER_TEMP/quality-reports"
          git rev-parse HEAD > "$RUNNER_TEMP/quality-reports/repository-sha.txt"
          npm ls --depth=0 > "$RUNNER_TEMP/quality-reports/npm-versions.txt"
          uvx --from ruff==0.15.12 ruff --version > "$RUNNER_TEMP/quality-reports/ruff-version.txt"
          node scripts/lint-ratchet.mjs eslint --report > "$RUNNER_TEMP/quality-reports/eslint.json"
          node scripts/lint-ratchet.mjs ruff --report > "$RUNNER_TEMP/quality-reports/ruff.json"
          node scripts/lint-ratchet.mjs dependency-cruiser --report > "$RUNNER_TEMP/quality-reports/dependencies.json"
          node scripts/lint-duplicates.mjs --report > "$RUNNER_TEMP/quality-reports/legacy-duplicates.json"
      - run: npm run check
        env:
          QUALITY_BASE_REV: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Python 代理单元测试
        run: |
          python -m unittest discover -s android -p 'test_*.py'
          python -m pip install -r e2e/mitmproxy/requirements.txt
          for directory in e2e/mitmproxy visual/cases/club/mitmproxy visual/cases/game-record/mitmproxy visual/cases/texas-holdem/mitmproxy visual/cases/zhajinhua/mitmproxy; do
            python -m unittest discover -s "$directory" -p 'test_*.py'
          done
      - name: 上传静态测量与仓库身份
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-reports/
          if-no-files-found: error
          retention-days: 14
