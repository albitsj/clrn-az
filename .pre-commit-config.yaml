minimum_pre_commit_version: '4.6.0'
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: repository-lint
        name: npm run lint
        entry: npm run lint
        language: system
        files: ^
        types: [file]
        always_run: true
        pass_filenames: false
        require_serial: true
      - id: repository-typecheck
        name: npm run typecheck
        entry: npm run typecheck
        language: system
        files: ^
        types: [file]
        always_run: true
        pass_filenames: false
        require_serial: true
